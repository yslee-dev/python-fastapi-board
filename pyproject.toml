[project]
name = "fastapi-board"
version = "0.1.0"
description = "Spring 개발자를 위한 FastAPI 게시판 CRUD 학습 프로젝트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
